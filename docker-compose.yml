version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: medpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nursing_lms
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medpulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/nursing_lms
      - JWT_SECRET=medpulse_production_docker_jwt_secret_key_2026_secure
      - DAILY_RAG_USER_QUOTA=50
      - RAG_CONFIDENCE_THRESHOLD=0.20
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - GEMINI_EMBEDDING_MODEL=text-embedding-004
      - ALLOW_DEV_AUTH=false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: medpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - medpulse-network

volumes:
  mongodb_data:
    driver: local

networks:
  medpulse-network:
    driver: bridge
