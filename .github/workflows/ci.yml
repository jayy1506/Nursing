name: MedPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo & Backend Dependencies
        run: |
          npm ci --ignore-scripts
          cd backend && npm ci

      - name: Run Backend Security, RAG & Admin Tooling Tests
        run: |
          cd backend && npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_ci_environment_32chars
          DAILY_RAG_USER_QUOTA: 50
          RAG_CONFIDENCE_THRESHOLD: 0.20

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Run Frontend Linter
        run: |
          cd frontend && npm run lint || true

      - name: Build Frontend Vite Bundle
        run: |
          cd frontend && npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
