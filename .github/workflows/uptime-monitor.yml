name: Scheduled Uptime & Health Monitor

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual one-click testing from Actions tab

jobs:
  check-health:
    name: Probe Production Health Endpoints
    runs-on: ubuntu-latest
    env:
      FAIL_SITE_1: 'false'
      FAIL_SITE_2: 'false'
      STATUS_1: '200'
      STATUS_2: '200'

    steps:
      - name: Check Primary Service Health (Site 1)
        id: probe_site_1
        env:
          TARGET_URL_1: ${{ secrets.SITE_1_HEALTH_URL }}
        run: |
          if [ -z "$TARGET_URL_1" ]; then
            echo "::warning::SITE_1_HEALTH_URL secret is not configured in GitHub repository secrets. Skipping probe."
            echo "FAIL_SITE_1=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "Probing $TARGET_URL_1 (Timeout: 100s to allow cold-start spin-up on Render free tier)..."
          HTTP_STATUS=$(curl -s -o /tmp/health_1.json -w "%{http_code}" --max-time 100 "$TARGET_URL_1") || HTTP_STATUS="000"
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/health_1.json || true
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "FAIL_SITE_1=true" >> $GITHUB_ENV
            echo "STATUS_1=$HTTP_STATUS" >> $GITHUB_ENV
          else
            echo "FAIL_SITE_1=false" >> $GITHUB_ENV
            echo "STATUS_1=200" >> $GITHUB_ENV
          fi

      - name: Check Secondary Service Health (Site 2 - Optional)
        id: probe_site_2
        env:
          TARGET_URL_2: ${{ secrets.SITE_2_HEALTH_URL }}
        run: |
          if [ -z "$TARGET_URL_2" ]; then
            echo "SITE_2_HEALTH_URL not configured. Skipping Site 2 probe."
            echo "FAIL_SITE_2=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "Probing Site 2: $TARGET_URL_2..."
          HTTP_STATUS=$(curl -s -o /tmp/health_2.json -w "%{http_code}" --max-time 100 "$TARGET_URL_2") || HTTP_STATUS="000"
          
          echo "Site 2 Status: $HTTP_STATUS"
          cat /tmp/health_2.json || true
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "FAIL_SITE_2=true" >> $GITHUB_ENV
            echo "STATUS_2=$HTTP_STATUS" >> $GITHUB_ENV
          else
            echo "FAIL_SITE_2=false" >> $GITHUB_ENV
            echo "STATUS_2=200" >> $GITHUB_ENV
          fi

      - name: Dispatch Alert Webhook on Outage
        if: env.FAIL_SITE_1 == 'true' || env.FAIL_SITE_2 == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          CURRENT_STATUS_1: ${{ env.STATUS_1 }}
          CURRENT_STATUS_2: ${{ env.STATUS_2 }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Health check failure detected (Site 1: $CURRENT_STATUS_1, Site 2: $CURRENT_STATUS_2), but ALERT_WEBHOOK_URL secret is not set!"
            exit 1
          fi

          ALERT_PAYLOAD=$(cat <<EOF
          {
            "content": "🚨 **MedPulse Uptime Alert**: One or more Render services are currently unavailable or degraded!\n- **Site 1 Status:** $CURRENT_STATUS_1\n- **Site 2 Status:** $CURRENT_STATUS_2\n- **Checked At:** $(date -u)\n- **Investigate:** Check Render Dashboard -> Service -> Logs.",
            "text": "🚨 MedPulse Alert: Render service health check failed with status $CURRENT_STATUS_1"
          }
          EOF
          )

          curl -s -H "Content-Type: application/json" -X POST -d "$ALERT_PAYLOAD" "$WEBHOOK_URL" || true
          exit 1
